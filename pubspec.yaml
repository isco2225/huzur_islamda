name: huzur_islamda
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Navigation
  go_router: 14.6.3

  cupertino_icons: ^1.0.8

  logging: ^1.2.0

  # Validation
  formz: 0.8.0

  #indicator
  smooth_page_indicator: ^1.2.1

  #Lottie animations
  lottie: ^3.3.2

  #Shimmer effect
  shimmer: ^3.0.0

  #Environment
  flutter_dotenv: ^6.0.0

  #Firebase
  firebase_core: ^4.2.0
  firebase_auth: ^6.1.1
  cloud_firestore: ^6.0.3
  cloud_functions: ^6.0.6

  #AdMob
  google_mobile_ads: ^7.0.0

  #Hive
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  #Shared Preferences
  shared_preferences: ^2.5.4

  #Connectivity
  connectivity_plus: ^7.0.0

  #Permissions
  permission_handler: ^12.0.1

  #Notifications
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.1

  #Prayer Times
  http: ^1.6.0

  #Sign In Methods
  google_sign_in: ^7.0.0
  sign_in_with_apple: ^7.0.1

  #Dependency Injection
  provider: ^6.1.2

  #Package Info(For version displayer)
  package_info_plus: ^9.0.0

  #Speed Dial(For floating action button)
  flutter_speed_dial: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code Generation
  build_runner: ^2.4.8
  hive_generator: ^2.0.1

  #Launcher Icons
  flutter_launcher_icons: ^0.14.4

  flutter_lints: ^5.0.0

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"

flutter:

  uses-material-design: true

  assets:
    - assets/animations/
    - assets/icons/
    - assets/data/places/
    - assets/data/dhikrs/
    - .env